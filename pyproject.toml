[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-extraccion-tecnica"
version = "0.1.0"
description = "Pipeline LCEL para extraer y validar entidades técnicas."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<2.0",
    "langchain-openai>=0.3.30,<2.0",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools]
py-modules = ["chain", "schemas", "example_async"]

[tool.pytest.ini_options]
testpaths = ["tests"]
